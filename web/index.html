<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F39200" />
    <title>TDMI Pointage</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <img src="/icons/tdmi-logo.svg" class="logo-tdmi" alt="TDMI" />
      <div class="status">
        <span id="pending" class="badge" hidden></span>
        <span id="dot" class="dot"></span>
        <span id="netlabel">…</span>
        <button id="settings-btn" class="icon-btn" title="Réglages" aria-label="Réglages">⚙️</button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabs">
      <button data-tab="pointage" class="active"><span class="ic">📝</span>Pointage</button>
      <button data-tab="planning"><span class="ic">📅</span>Planning</button>
      <button data-tab="dashboard"><span class="ic">📊</span>Bilan</button>
      <button data-tab="referentiel"><span class="ic">🏗️</span>Référentiel</button>
    </nav>

    <div id="toast" class="toast"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
