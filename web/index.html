<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>Pointage BTP</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <img src="/icons/icon.svg" class="logo" alt="" />
      <h1>Pointage BTP</h1>
      <div class="status">
        <span id="pending" class="badge" hidden></span>
        <span id="dot" class="dot"></span>
        <span id="netlabel">…</span>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabs">
      <button data-tab="pointage" class="active"><span class="ic">📝</span>Pointage</button>
      <button data-tab="dashboard"><span class="ic">📊</span>Tableau de bord</button>
      <button data-tab="referentiel"><span class="ic">🏗️</span>Référentiel</button>
    </nav>

    <div id="toast" class="toast"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
