<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f6f4f0" />
    <title>TDMI Pointage</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- En-tête contextuel, rendu par app.js selon l'onglet -->
    <header id="appbar" class="appbar"></header>
    <div id="netbar" class="netbar" hidden></div>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="accueil" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8" />
        </svg>
        Accueil
      </button>
      <button data-tab="pointage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" />
        </svg>
        Pointage
      </button>
      <button data-tab="equipe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.2" /><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0" />
          <path d="M16.5 5.6a3.2 3.2 0 0 1 0 6" /><path d="M18 14.4a6.2 6.2 0 0 1 3.2 5.6" />
        </svg>
        Équipe
      </button>
      <button data-tab="rapports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V10" /><path d="M10 20V4" /><path d="M16 20v-7" /><path d="M22 20H2" />
        </svg>
        Rapports
      </button>
      <button data-tab="profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.6" /><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
        </svg>
        Profil
      </button>
    </nav>

    <div id="toast" class="toast"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
