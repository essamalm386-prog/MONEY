# Compile et verifie l'application Android.
#
# La construction se fait ici et pas en local : elle demande le SDK
# Android, que les executeurs GitHub fournissent deja.
#
# Trois etages, du plus rapide au plus lent, pour que l'erreur la
# plus frequente se voie en premier :
#   1. le moteur metier, sans Android — quelques secondes ;
#   2. la compilation complete et les tests unitaires ;
#   3. l'emulateur, pour les tests d'interface et les captures.

name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Nom de version (ex. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metier:
    name: Moteur métier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Récupérer le compilateur Kotlin
        run: outils/telecharger-kotlin.sh
      - name: Vérifier les règles métier
        run: outils/verifier-metier-kotlin.sh

  construire:
    name: Compiler et tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Reconstituer la clé de signature
        id: cle
        env:
          FICHIER: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FICHIER" ]; then
            echo "$FICHIER" | base64 -d > "$RUNNER_TEMP/dress-code.jks"
            echo "presente=oui" >> "$GITHUB_OUTPUT"
          else
            echo "presente=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucune clé de publication : signature de débogage."
          fi

      - name: Construire l'APK
        working-directory: android
        run: |
          ARGS="-PversionName=${{ github.event.inputs.versionName || '1.0.0' }} -PversionCode=${{ github.run_number }}"
          if [ "${{ steps.cle.outputs.presente }}" = "oui" ]; then
            ARGS="$ARGS -PstoreFilePath=$RUNNER_TEMP/dress-code.jks"
            ARGS="$ARGS -PstorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            ARGS="$ARGS -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            ARGS="$ARGS -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          fi
          ./gradlew --no-daemon assembleRelease $ARGS

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dress-code-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

  emulateur:
    name: Interface sur émulateur
    needs: construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # L'accelerateur materiel n'existe pas sur un executeur GitHub
      # standard : sans cette etape, l'emulateur rame au point
      # d'expirer.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests d'interface et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: |
            # Les captures valent surtout quand le test echoue : on les
            # recupere avant de propager l'echec, sinon on diagnostique
            # a l'aveugle.
            set +e
            ./gradlew --no-daemon connectedDebugAndroidTest
            statut=$?
            adb pull \
              /sdcard/Android/data/com.essama.dresscode.debug/files/Pictures/dress-code \
              captures
            exit $statut

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-android
          path: android/captures/
          if-no-files-found: ignore
