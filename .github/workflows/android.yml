name: APK Android (TDMI Pointage)

# Compile l'application Android TDMI et publie l'APK en artefact téléchargeable.
#  - à chaque push et sur demande manuelle : APK de debug (installable directement) ;
#  - si les secrets de signature sont configurés : APK de release signé ;
#  - sur un tag `v*` : création d'une Release GitHub avec l'APK attaché.
# Voir ANDROID.md pour la récupération de l'APK et la configuration du keystore.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour attacher l'APK à une Release sur tag

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Version unique, réutilisée pour le versionCode/versionName embarqué et
      # pour le nom du fichier APK — évite toute divergence entre les deux.
      - name: Déterminer la version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version de ce build : $VERSION"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Garde-fou : on ne publie pas d'APK si la logique métier est cassée.
      - name: Lancer la vérification de types et les tests
        run: |
          npm run typecheck
          npm test

      # Gradle 8.2.1 / AGP 8.2.1 exigent Java 17 (Java 21 n'est pas supporté).
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      # Les assets web ne sont pas versionnés : ils sont copiés depuis web/.
      - name: Synchroniser les assets web dans le projet Android
        run: npx cap sync android

      - name: Préparer le keystore de signature (si configuré)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tdmi-release.jks"
          echo "path=$RUNNER_TEMP/tdmi-release.jks" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK de debug
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ env.APP_VERSION }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Compiler l'APK de release signé
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ env.APP_VERSION }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rassembler et renommer les APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/TDMI-Pointage-${APP_VERSION}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               "dist/TDMI-Pointage-${APP_VERSION}-release.apk"
          else
            echo "::notice::Pas d'APK de release : secrets de signature non configurés (voir ANDROID.md)."
          fi
          ls -lh dist/

      - name: Publier l'APK en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: TDMI-Pointage-${{ env.APP_VERSION }}
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attacher l'APK à la Release (sur tag v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: TDMI Pointage ${{ env.APP_VERSION }}
          generate_release_notes: true
