# Compile et verifie l'application Android.
#
# La construction se fait ici et pas en local : elle demande le SDK
# Android, que les executeurs GitHub fournissent deja.
#
# Trois etages, du plus rapide au plus lent, pour que l'erreur la
# plus frequente se voie en premier :
#   1. le moteur metier, sans Android — quelques secondes ;
#   2. la compilation complete et les tests unitaires ;
#   3. l'emulateur, pour les tests d'interface et les captures.

name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Nom de version (ex. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metier:
    name: Moteur métier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Récupérer le compilateur Kotlin
        run: outils/telecharger-kotlin.sh
      - name: Vérifier les règles métier
        run: outils/verifier-metier-kotlin.sh

  construire:
    name: Compiler et tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Reconstituer la clé de signature
        id: cle
        env:
          FICHIER: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FICHIER" ]; then
            echo "$FICHIER" | base64 -d > "$RUNNER_TEMP/dress-code.jks"
            echo "presente=oui" >> "$GITHUB_OUTPUT"
          else
            echo "presente=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucune clé de publication : signature de débogage."
          fi

      - name: Construire l'APK
        working-directory: android
        run: |
          ARGS="-PversionName=${{ github.event.inputs.versionName || '1.0.0' }} -PversionCode=${{ github.run_number }}"
          if [ "${{ steps.cle.outputs.presente }}" = "oui" ]; then
            ARGS="$ARGS -PstoreFilePath=$RUNNER_TEMP/dress-code.jks"
            ARGS="$ARGS -PstorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            ARGS="$ARGS -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            ARGS="$ARGS -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          fi
          ./gradlew --no-daemon assembleRelease $ARGS

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dress-code-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

  emulateur:
    name: Interface sur émulateur
    needs: construire
    runs-on: ubuntu-latest
    # Necessaire pour deposer les captures sur la branche « captures ».
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # L'accelerateur materiel n'existe pas sur un executeur GitHub
      # standard : sans cette etape, l'emulateur rame au point
      # d'expirer.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests d'interface et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          # android-emulator-runner execute CHAQUE LIGNE du script dans
          # un shell distinct : une variable ne survit pas d'une ligne a
          # la suivante, et une continuation « \ » casse. Tout tient donc
          # sur une seule ligne.
          # Les captures sortent par le service de stockage de test, que
          # Gradle rapatrie dans les sorties de build : adb ne peut plus
          # lire le dossier externe d'une application depuis Android 11.
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-android
          path: android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

      # Les artefacts sont servis depuis un stockage que certains
      # reseaux d'entreprise n'atteignent pas. Une branche dediee rend
      # les captures lisibles par un simple « git fetch », et donne un
      # historique visuel de l'interface au fil des versions.
      #
      # Branche a part, jamais la branche de la PR : y pousser
      # relancerait ce meme workflow en boucle.
      - name: Déposer les captures sur la branche « captures »
        if: always()
        env:
          # Par l'environnement plutot que dans la ligne de commande :
          # un jeton dans un argument se retrouve dans les traces.
          JETON: ${{ github.token }}
        run: |
          source=$(find android/app/build/outputs/connected_android_test_additional_output \
                   -name '*.png' -print -quit 2>/dev/null || true)
          if [ -z "$source" ]; then
            echo "::notice::Aucune capture produite, rien à déposer."
            exit 0
          fi

          depot=$(mktemp -d)
          git init -q "$depot"
          cd "$depot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${JETON}@github.com/${{ github.repository }}.git"

          mkdir -p android
          find "$GITHUB_WORKSPACE/android/app/build/outputs/connected_android_test_additional_output" \
            -name '*.png' -exec cp {} android/ \;

          cat > LISEZ-MOI.md <<TEXTE
          # Captures de l'application Android

          Produites par le test de parcours sur émulateur, à chaque
          exécution du workflow Android. Cette branche est réécrite à
          chaque fois : elle montre l'état courant, pas un historique.

          Commit : ${{ github.sha }}
          TEXTE

          git add -A
          git commit -q -m "Captures de l'interface — ${{ github.sha }}"
          # Force : cette branche est un miroir de l'etat courant.
          git push -q --force origin HEAD:captures
          echo "::notice::Captures déposées sur la branche « captures »."

